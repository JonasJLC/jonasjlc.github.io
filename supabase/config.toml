# Declares only the hosted-project settings this app needs. `supabase config push` leaves
# everything not declared here unchanged and shows a diff before it writes.
# Secrets are read from .env (git-ignored) via env(); never write them in this file.
project_id = "jonasjlc-ferie"

[auth]
# Both household members have already signed in; closing signup stops anyone else from
# creating an account (Google included). To add a person later, re-enable this briefly.
enable_signup = false
site_url = "https://jonasjlc.github.io/ferie/"
additional_redirect_urls = [
  "https://jonasjlc.github.io/ferie/",
  "http://localhost:4321/ferie/",
]

# The app signs in with Google only; this also turns off email/password and magic-link accounts.
[auth.email]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# The AI chat for feature requests. verify_jwt is off because the function verifies the caller's
# token itself (auth.getUser) and checks household membership before doing anything.
# The Anthropic key is a secret, never committed:
#   supabase secrets set ANTHROPIC_API_KEY=...
[functions.feature-chat]
verify_jwt = false

# Mirrors a saved feature request to a GitHub issue. Same JWT handling as feature-chat.
# The token is a secret, never committed (fine-grained PAT, this repo only, Issues read/write):
#   supabase secrets set GITHUB_ISSUES_TOKEN=...
[functions.create-issue]
verify_jwt = false
