# Declares only the hosted-project settings this app needs. `supabase config push` leaves
# everything not declared here unchanged and shows a diff before it writes.
# Secrets are read from .env (git-ignored) via env(); never write them in this file.
project_id = "jonasjlc-ferie"

[auth]
# Both household members have already signed in; closing signup stops anyone else from
# creating an account (Google included). To add a person later, re-enable this briefly.
enable_signup = false
site_url = "https://jonasjlc.github.io/ferie/"
additional_redirect_urls = [
  "https://jonasjlc.github.io/ferie/",
  "http://localhost:4321/ferie/",
  "https://jonasjlc.github.io/strandparken/",
  "http://localhost:4321/strandparken/",
]

# The app signs in with Google only; this also turns off email/password and magic-link accounts.
[auth.email]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# The AI chat for feature requests. verify_jwt is off because the function verifies the caller's
# token itself (auth.getUser) and checks household membership before doing anything.
# The Anthropic key is a secret, never committed:
#   supabase secrets set ANTHROPIC_API_KEY=...
[functions.feature-chat]
verify_jwt = false

# Reads Udenrigsministeriets rejsevejledning for a destination and summarises it. Same JWT handling
# and ANTHROPIC_API_KEY secret as feature-chat.
[functions.destination-tips]
verify_jwt = false

# Mirrors a saved feature request to a GitHub issue. Same JWT handling as feature-chat.
# The token is a secret, never committed (fine-grained PAT, this repo only, Issues read/write):
#   supabase secrets set GITHUB_ISSUES_TOKEN=...
[functions.create-issue]
verify_jwt = false

# Strandparken functions. verify_jwt is off for the same reason as above: _shared/guard.ts verifies the token,
# the household membership and the person key before any function body runs. Secrets (never committed):
#   supabase secrets set ANTHROPIC_API_KEY=...
# Optional: SP_AI_MODEL (default claude-haiku-5-5), AI_MONTHLY_CAP_DKK (50), AI_DAILY_CALLS_PER_PERSON (60), AI_USD_DKK (7).
# Tests: deno test --node-modules-dir=none --no-lock --allow-env supabase/functions
[functions.sp-status]
verify_jwt = false

# Recipe import from pasted text, screenshots and links (slices 1.6 and 1.2). The function fetches pages itself, so it needs outbound network. Optional: SP_AI_MODEL_VISION (default claude-sonnet-5-5).
[functions.recipe-import]
verify_jwt = false

# Fetches a recipe photo for the browser to resize (Idé 1). Outbound network; no AI, no secrets beyond the platform's.
[functions.recipe-image]
verify_jwt = false

# AI dinner suggestion for an empty day (slice 2.2).
[functions.meal-suggest]
verify_jwt = false

# Health data (idea 10, ADR-06). Secrets (never committed):
#   supabase secrets set SP_TOKEN_KEY=$(openssl rand -base64 32)        # AES-GCM key for provider tokens and the Garmin key
#   supabase secrets set SP_OAUTH_STATE_KEY=$(openssl rand -base64 32)  # seals the OAuth state (and its PKCE verifier)
#   supabase secrets set SP_CRON_SECRET=$(openssl rand -hex 32)         # pg_cron's bearer for mode `all`; also stored in Vault
#   supabase secrets set OURA_CLIENT_ID=... OURA_CLIENT_SECRET=...      # Oura API application "Strandparken"
# Optional, once the Garmin Personal Swagger docs are checked: GARMIN_API_BASE, GARMIN_DAILIES_PATH, GARMIN_SLEEPS_PATH.
# Until the secrets exist the functions answer 503 not_configured (or 401 for cron) and store nothing.

# Sync on app open (mode `self`, the guard) and from pg_cron (mode `all`, the cron secret).
[functions.health-sync]
verify_jwt = false

# Oura connect (start + the GET callback, which carries no JWT: the sealed state authenticates it), Garmin key, disconnect.
# The Oura redirect URI is this function's URL: https://kmytekaexgfqhwxapwbw.supabase.co/functions/v1/health-oauth
[functions.health-oauth]
verify_jwt = false

# Calendar on Hjem (Idé 7): reads the private iCal addresses people add in Indstillinger › Kalendere. Outbound network.
# The addresses are stored encrypted with a key that is a secret, never committed:
#   supabase secrets set SP_FEED_KEY=$(openssl rand -base64 32)
[functions.calendar]
verify_jwt = false
